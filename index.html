<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  <title>סינכרון צוות</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <style>
    :root{font-family:system-ui,"Segoe UI",Arial,sans-serif;color:#0f172a;background:#f1f5f9}
    *{box-sizing:border-box}body{margin:0;min-height:100vh}button{font:inherit;cursor:pointer}
    .hidden{display:none!important}.screen{min-height:100vh;display:grid;place-items:center;padding:20px}
    #loginScreen{background:linear-gradient(135deg,#1d4ed8,#7c3aed)}.card{width:min(680px,100%);padding:28px;background:#fff;border-radius:22px;box-shadow:0 20px 60px #0003}
    .login-card{text-align:center;width:min(430px,100%)}h1,h2{margin-top:0}.logo{width:72px;height:72px;margin:0 auto 16px;display:grid;place-items:center;border-radius:22px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font-size:34px}
    .google-btn{width:100%;padding:14px;border:1px solid #d1d5db;border-radius:12px;background:#fff;font-weight:700}.muted{color:#64748b}.error{margin-top:14px;color:#b91c1c;white-space:pre-wrap}
    header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}.btn{border:0;border-radius:10px;padding:10px 15px;font-weight:700}.primary{background:#2563eb;color:#fff}.secondary{background:#e2e8f0;color:#0f172a}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.stat{padding:18px;border:1px solid #e2e8f0;border-radius:14px;background:#f8fafc}.stat strong{display:block;font-size:1.7rem}.list{display:grid;gap:10px;margin-top:14px}.item{padding:13px;border:1px solid #e2e8f0;border-radius:12px}.form{display:flex;gap:10px;margin-top:18px}.input{flex:1;padding:11px;border:1px solid #cbd5e1;border-radius:10px}.message{padding:10px 12px;background:#eff6ff;border-radius:10px}.message b{display:block;font-size:.85rem}
    @media(max-width:560px){.form{flex-direction:column}header{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
  <section id="loginScreen" class="screen">
    <div class="card login-card">
      <div class="logo">✦</div>
      <h1>סינכרון צוות</h1>
      <p class="muted">מערכת חכמה לניהול משימות ותקשורת</p>
      <button id="googleLogin" class="google-btn">🔵 התחברות באמצעות Google</button>
      <p id="loginError" class="error"></p>
    </div>
  </section>

  <main id="app" class="screen hidden">
    <div class="card">
      <header>
        <div><h1>שלום, <span id="userName">חבר צוות</span> 👋</h1><p id="userEmail" class="muted"></p></div>
        <button id="logoutBtn" class="btn secondary">⎋ יציאה</button>
      </header>
      <div class="grid">
        <div class="stat"><span>משימות</span><strong id="taskCount">0</strong></div>
        <div class="stat"><span>משתמשים</span><strong id="userCount">0</strong></div>
        <div class="stat"><span>הודעות</span><strong id="messageCount">0</strong></div>
      </div>
      <section style="margin-top:24px">
        <h2>משימות</h2>
        <div id="tasks" class="list"><p class="muted">טוען...</p></div>
      </section>
      <section style="margin-top:24px">
        <h2>צ׳אט קבוצתי</h2>
        <div id="messages" class="list"></div>
        <form id="chatForm" class="form">
          <input id="chatInput" class="input" maxlength="500" placeholder="כתוב הודעה" autocomplete="off">
          <button class="btn primary">שלח</button>
        </form>
      </section>
    </div>
  </main>

  <script>
    "use strict";

    const firebaseConfig = {
      apiKey: "AIzaSyDIdndgqboytlTQoYJRstLTGMSuhsZCIks",
      authDomain: "team-sync-2026.firebaseapp.com",
      projectId: "team-sync-2026",
      storageBucket: "team-sync-2026.firebasestorage.app",
      messagingSenderId: "136486994118",
      appId: "1:136486994118:web:7da06412881551120957c7",
      measurementId: "G-16PX9WZ74Y"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const provider = new firebase.auth.GoogleAuthProvider();
    let currentUser = null;
    let stopTasks = null;
    let stopUsers = null;
    let stopMessages = null;

    const $ = id => document.getElementById(id);
    const showError = message => { $("loginError").textContent = message; };
    const escapeHTML = value => String(value ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");

    function showLogin() {
      $("loginScreen").classList.remove("hidden");
      $("app").classList.add("hidden");
    }

    function showApp(user) {
      $("loginScreen").classList.add("hidden");
      $("app").classList.remove("hidden");
      $("userName").textContent = user.displayName || user.email || "חבר צוות";
      $("userEmail").textContent = user.email || "";
    }

    async function saveUser(user) {
      const ref = db.collection("users").doc(user.uid);
      const snapshot = await ref.get();
      if (!snapshot.exists) {
        await ref.set({
          uid: user.uid,
          name: user.displayName || "",
          email: (user.email || "").toLowerCase(),
          photoURL: user.photoURL || "",
          role: "member",
          active: (user.email || "").toLowerCase() === "a0583211042@gmail.com",
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      }
    }

    function listenToData() {
      stopTasks?.(); stopUsers?.(); stopMessages?.();
      stopTasks = db.collection("tasks").orderBy("week").onSnapshot(snapshot => {
        const tasks = snapshot.docs.map(doc => ({id:doc.id,...doc.data()}));
        $("taskCount").textContent = tasks.length;
        $("tasks").innerHTML = tasks.length ? tasks.map(task => `<div class="item"><b>${escapeHTML(task.title || "ללא כותרת")}</b><br><span class="muted">שבוע ${escapeHTML(task.week)} · ${escapeHTML(task.assignee || "")}</span></div>`).join("") : `<p class="muted">אין משימות.</p>`;
      }, error => console.error("Tasks:", error));
      stopUsers = db.collection("users").onSnapshot(snapshot => { $("userCount").textContent = snapshot.size; }, error => console.error("Users:", error));
      stopMessages = db.collection("chatMessages").orderBy("createdAt","asc").limitToLast(100).onSnapshot(snapshot => {
        const messages = snapshot.docs.map(doc => doc.data());
        $("messageCount").textContent = messages.length;
        $("messages").innerHTML = messages.length ? messages.map(message => `<div class="message"><b>${escapeHTML(message.userName || "משתמש")}</b>${escapeHTML(message.text)}</div>`).join("") : `<p class="muted">אין הודעות.</p>`;
      }, error => console.error("Messages:", error));
    }

    // Redirect avoids popup/cookie problems on GitHub Pages.
    $("googleLogin").addEventListener("click", async () => {
      showError("");
      try { await auth.signInWithRedirect(provider); }
      catch (error) { console.error(error); showError(error.message || "ההתחברות נכשלה"); }
    });

    auth.getRedirectResult().catch(error => {
      console.error("Google redirect error:", error);
      if (error.code === "auth/unauthorized-domain") showError("הדומיין לא מאושר ב-Firebase: a0583211042-gif.github.io");
      else showError(error.message || "ההתחברות נכשלה");
    });

    auth.onAuthStateChanged(async user => {
      currentUser = user;
      if (!user) { showLogin(); return; }
      try {
        await saveUser(user);
        const profile = (await db.collection("users").doc(user.uid).get()).data();
        const isAdmin = (user.email || "").toLowerCase() === "a0583211042@gmail.com";
        if (!isAdmin && (!profile || profile.active !== true)) {
          await auth.signOut();
          showError("החשבון שלך ממתין לאישור מנהל.");
          return;
        }
        showApp(user);
        listenToData();
      } catch (error) {
        console.error(error);
        showError("לא ניתן לטעון את פרופיל המשתמש. בדוק את Firestore Rules.");
      }
    });

    $("logoutBtn").addEventListener("click", () => auth.signOut());
    $("chatForm").addEventListener("submit", async event => {
      event.preventDefault();
      const input = $("chatInput");
      const text = input.value.trim();
      if (!text || !currentUser) return;
      try {
        await db.collection("chatMessages").add({
          userId: currentUser.uid,
          userName: currentUser.displayName || currentUser.email,
          text,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        input.value = "";
      } catch (error) { console.error(error); alert("שליחת ההודעה נכשלה"); }
    });
  </script>
</body>
</html>
