<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>לוח שבועות ראשי — סינכרון קבוצתי</title>

<!-- ספריות ענן -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<style>
  :root {
    --primary: #2a5298;
    --primary-dark: #1e3c72;
    --primary-light: #f0f4ff;
    --green: #2e7d32;
    --current: #d97706;
    --current-light: #fef3c7;
    --bg: #f4f6f9;
    --card: #ffffff;
    --text: #333;
    --muted: #888;
    --border: #e0e0e0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    padding: 20px;
    min-height: 100vh;
  }
  .container { max-width: 900px; margin: 0 auto; }

  /* תפריט ניווט עליון בין העמודים */
  .nav-bar {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 20px;
    background: #fff;
    padding: 10px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    border: 1px solid var(--border);
  }
  .nav-btn {
    padding: 8px 16px;
    border-radius: 8px;
    border: none;
    background: #f8fafc;
    color: var(--primary-dark);
    font-weight: 700;
    font-size: 0.9rem;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.15s;
  }
  .nav-btn:hover { background: var(--primary-light); color: var(--primary); }
  .nav-btn.active { background: var(--primary); color: #fff; }

  header {
    text-align: center;
    margin-bottom: 20px;
    background: linear-gradient(135deg, var(--primary-dark), var(--primary));
    color: #fff;
    padding: 26px 24px;
    border-radius: 14px;
    box-shadow: 0 6px 20px rgba(30,60,114,0.18);
    position: relative;
  }
  header h1 { font-size: clamp(1.4rem, 3vw, 2rem); margin-bottom: 6px; }
  header p  { font-size: clamp(0.95rem, 2vw, 1.05rem); opacity: 0.92; }

  .current-week-badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: rgba(255,255,255,0.2);
    border: 1px solid rgba(255,255,255,0.4);
    padding: 6px 16px;
    border-radius: 999px;
    font-size: .95rem;
    margin-top: 12px;
  }

  .view-tabs {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .view-tab {
    padding: 10px 18px;
    border-radius: 10px;
    border: 2px solid var(--border);
    background: #fff;
    color: var(--primary-dark);
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 2px 5px rgba(0,0,0,0.04);
  }
  .view-tab.active { background: var(--primary); color: #fff; border-color: var(--primary-dark); }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    align-items: center;
    margin-bottom: 18px;
  }
  .toolbar.hidden { display: none; }
  .toolbar input[type="search"] {
    flex: 1 1 240px;
    max-width: 360px;
    padding: 10px 14px;
    border-radius: 10px;
    border: 2px solid var(--border);
    font-size: 1rem;
  }
  .toolbar button {
    padding: 10px 16px;
    border-radius: 10px;
    border: 2px solid var(--border);
    background: #fff;
    color: var(--primary-dark);
    font-weight: 600;
    cursor: pointer;
  }

  .weeks-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
    gap: 10px;
    margin-bottom: 20px;
    padding-top: 14px;
  }
  .week-btn {
    position: relative;
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 12px 6px;
    text-align: center;
    font-size: 1rem;
    font-weight: 700;
    color: var(--primary);
    cursor: pointer;
    box-shadow: 0 2px 5px rgba(0,0,0,0.04);
  }
  .week-btn:hover { border-color: var(--primary); background: var(--primary-light); }
  .week-btn.active { background: var(--primary); color: #fff; border-color: var(--primary-dark); }
  .week-btn.current { border-color: var(--current); background: var(--current-light); color: #78350f; }

  .instructions {
    text-align: center;
    color: #666;
    font-size: 1.05rem;
    padding: 40px 20px;
    background: var(--card);
    border-radius: 14px;
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
  }
  .modal-overlay[hidden] { display: none; }
  .modal-content {
    background: #fff;
    border-radius: 14px;
    max-width: 520px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    padding: 26px;
    position: relative;
  }
  .modal-close {
    position: absolute;
    top: 12px;
    left: 12px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: none;
    background: #f0f0f0;
    color: #555;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
  }
  .category-row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 12px;
    padding: 12px 15px;
    background: #f8fafc;
    border-radius: 10px;
    border-inline-start: 4px solid var(--primary);
  }
  .category-row.hasb { border-inline-start-color: var(--green); }
  .category-name { font-weight: 700; min-width: 96px; color: #444; }
  .category-content { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .empty-slot { color: var(--muted); font-style: italic; }

  .person-card, .category-section {
    background: var(--card);
    border-radius: 14px;
    padding: 18px 22px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.06);
    margin-bottom: 14px;
  }
  .person-card h3, .category-section h3 {
    font-size: 1.15rem;
    color: var(--primary-dark);
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 2px solid #eaeaea;
  }
  .person-card ul, .category-section ul { list-style: none; }
  .person-card li, .category-section li {
    padding: 10px 14px;
    border-radius: 8px;
    border-inline-start: 3px solid var(--primary);
    background: #f8fafc;
    margin-bottom: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .row-head { display: flex; align-items: center; gap: 10px; }
  .week-badge { background: var(--primary); color: #fff; padding: 2px 10px; border-radius: 999px; font-size: .82rem; font-weight: 700; }
  .topic-line { display: flex; align-items: center; gap: 6px; font-size: .9rem; color: #555; padding: 4px 10px; border-inline-start: 2px solid #d0d0d0; }
  .add-topic-btn { padding: 4px 12px; border-radius: 6px; border: 1.5px dashed var(--primary); background: #fff; color: var(--primary); cursor: pointer; }
  .edit-topic-btn { width: 22px; height: 22px; border-radius: 50%; border: 1px solid #ccc; background: #fff; cursor: pointer; }
  .modal-footer { margin-top: 20px; padding-top: 16px; border-top: 1px solid #eaeaea; display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .set-current-btn { padding: 10px 20px; border-radius: 10px; border: 2px solid var(--current); background: #fff; color: var(--current); font-weight: 700; cursor: pointer; }
  .current-note { padding: 10px 20px; border-radius: 10px; background: var(--current-light); color: #78350f; font-weight: 600; }
  .no-results { text-align: center; color: var(--muted); padding: 24px; font-style: italic; display: none; }
  .no-results.show { display: block; }
</style>
</head>
<body>
<div class="container">
  <!-- תפריט ניווט עליון -->
  <nav class="nav-bar">
    <a href="board.html" class="nav-btn active">📅 לוח ראשי</a>
    <a href="personal.html" class="nav-btn">👤 אזור אישי</a>
    <a href="chat.html" class="nav-btn">💬 צ'אט קבוצתי</a>
  </nav>

  <header>
    <h1>לוח שבועות מרוכז</h1>
    <p>עיון לפי שבוע, לפי שם או לפי קטגוריה</p>
    <div class="current-week-badge" id="currentBadge"></div>
  </header>

  <div class="view-tabs" role="tablist">
    <button type="button" class="view-tab active" data-view="week">📅 לפי שבוע</button>
    <button type="button" class="view-tab" data-view="person">👤 לפי שם</button>
    <button type="button" class="view-tab" data-view="category">🏷️ לפי קטגוריה</button>
  </div>

  <div class="toolbar hidden" id="toolbar">
    <input type="search" id="search" placeholder="חיפוש...">
    <button type="button" id="clearBtn">נקה</button>
  </div>

  <div id="view-week" class="view-panel">
    <div class="weeks-grid" id="weeksGrid"></div>
    <div id="instructions" class="instructions">👆 בחר שבוע מהרשימה למעלה כדי להציג את הפעילויות.</div>
  </div>

  <div id="view-person" class="view-panel" hidden>
    <div id="personList"></div>
    <p id="personNoResults" class="no-results">לא נמצאו שמות מתאימים.</p>
  </div>

  <div id="view-category" class="view-panel" hidden>
    <div id="categoryList"></div>
  </div>
</div>

<div class="modal-overlay" id="weekModal" hidden>
  <div class="modal-content">
    <button type="button" class="modal-close" id="modalClose">✕</button>
    <div id="modalBody"></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // בדיקה אם המשתמש מחובר, אם לא - מחזיר לדף הכניסה
  if (!localStorage.getItem('loggedUser')) {
    window.location.href = 'index.html';
  }

  const firebaseConfig = {
    apiKey: "AIzaSyB_AerhoBm-VJPqf25kOH1S4xGdauV2EDI",
    authDomain: "group-hub-2026.firebaseapp.com",
    projectId: "group-hub-2026",
    storageBucket: "group-hub-2026.firebasestorage.app",
    messagingSenderId: "816870308307",
    appId: "1:816870308307:web:c3252cbb51f4f075d49726",
    measurementId: "G-KMJ1H172PN"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const PEOPLE = {
    aharonShemesh:    'אהרן שמש',
    aharonPotesh:     'אהרן פוטש',
    yaakovPotesh:     'יעקב פוטש',
    ephraimResh:      'אפרים גוטליב (ר)',
    ephraimBet:       'אפרים גוטליב (ב)',
    yehudaKaufman:    'יהודה קויפמן',
    avrahamGutstein:  'אברהם גוטשטיין',
    asherPisrbavsky:  'אשר פיסרבסקי'
  };

  const nameOf = (key) => (key == null || key === '') ? null : (PEOPLE[key] || key);

  const WEEK_DATA = {
    2:  { added: 'aharonShemesh',   sachi: null,                     hasb: { trainee: 'ephraimResh',    topic: 'גיוס לצה"ל ושליחות' } },
    3:  { added: 'aharonPotesh',    sachi: 'asherPisrbavsky',        hasb: null },
    4:  { added: 'yaakovPotesh',    sachi: null,                     hasb: { trainee: 'aharonShemesh',  topic: 'חגי תשרי' } },
    5:  { added: 'ephraimResh',     sachi: 'yaakovPotesh',           hasb: null },
    6:  { added: 'yehudaKaufman',   sachi: null,                     hasb: { trainee: 'ephraimResh',    topic: 'ידיעת הארץ' } },
    7:  { added: 'ephraimBet',      sachi: 'ephraimBet',             hasb: null },
    8:  { added: 'avrahamGutstein', sachi: null,                     hasb: { trainee: 'ephraimBet',     topic: 'רצח רבין' } },
    9:  { added: 'asherPisrbavsky', sachi: 'aharonShemesh',          hasb: null },
    10: { added: 'aharonShemesh',   sachi: null,                     hasb: { trainee: 'ephraimResh',    topic: 'ציונות' } },
    11: { added: 'yaakovPotesh',    sachi: 'yaakovPotesh',           hasb: null },
    12: { added: 'aharonPotesh',    sachi: null,                     hasb: { trainee: 'aharonShemesh',  topic: 'ירושלים' } },
    13: { added: 'ephraimResh',     sachi: 'aharonPotesh',           hasb: null },
    14: { added: 'ephraimBet',      sachi: null,                     hasb: { trainee: 'asherPisrbavsky',topic: 'זהות וחברה ישראלית' } },
    15: { added: 'yehudaKaufman',   sachi: 'yehudaKaufman',          hasb: null },
    16: { added: 'avrahamGutstein', sachi: null,                     hasb: { trainee: 'asherPisrbavsky',topic: 'איכות הסביבה' } },
    17: { added: 'asherPisrbavsky', sachi: 'yaakovPotesh',           hasb: null },
    18: { added: 'aharonShemesh',   sachi: null,                     hasb: { trainee: 'yehudaKaufman',  topic: 'גזענות וסטיגמות' } },
    19: { added: 'yaakovPotesh',    sachi: 'aharonPotesh',           hasb: null },
    20: { added: 'aharonPotesh',    sachi: null,                     hasb: { trainee: 'ephraimBet',     topic: 'המהפכה התעשייתית' } },
    21: { added: 'ephraimResh',     sachi: 'avrahamGutstein',        hasb: null },
    22: { added: 'ephraimBet',      sachi: null,                     hasb: { trainee: 'aharonPotesh',   topic: 'מבצע אנטבה' } },
    23: { added: 'avrahamGutstein', sachi: 'aharonShemesh',          hasb: null },
    24: { added: 'yehudaKaufman',   sachi: null,                     hasb: { trainee: 'avrahamGutstein',topic: 'עבודת צוות וכוחה של קבוצה' } },
    25: { added: 'asherPisrbavsky', sachi: 'ephraimBet',             hasb: null },
    26: { added: 'yaakovPotesh',    sachi: null,                     hasb: { trainee: 'aharonShemesh',  topic: 'ש"י עגנון' } },
    27: { added: 'aharonShemesh',   sachi: 'avrahamGutstein',        hasb: null },
    28: { added: null,              sachi: null,                     hasb: { trainee: 'asherPisrbavsky',topic: 'מלחמת ששת הימים' } },
    29: { added: null,              sachi: 'ephraimResh',            hasb: null },
    30: { added: null,              sachi: null,                     hasb: { trainee: 'yehudaKaufman',  topic: 'מבצע קדש' } }
  };

  const CAT_NAMES = { added: 'ערך מוסף', sachi: 'סח"י', hasb: 'הסב"ש' };
  const ALL_WEEKS = Object.keys(WEEK_DATA).map(Number).sort((a, b) => a - b);

  let cloudTopics = {};

  db.collection("groupData").doc("customTopics").onSnapshot((doc) => {
    cloudTopics = doc.data() || {};
    refreshUI();
  });

  function getTopicFor(week, cat) {
    if (cat === 'hasb') {
      const d = WEEK_DATA[week];
      return (d && d.hasb && d.hasb.topic) || null;
    }
    return (cloudTopics[week] && cloudTopics[week][cat]) || null;
  }

  function saveTopicToCloud(week, cat, text) {
    if (!cloudTopics[week]) cloudTopics[week] = {};
    if (text && text.trim()) cloudTopics[week][cat] = text.trim();
    else {
      delete cloudTopics[week][cat];
      if (Object.keys(cloudTopics[week]).length === 0) delete cloudTopics[week];
    }
    db.collection("groupData").doc("customTopics").set(cloudTopics).catch(() => {});
  }

  let CURRENT_WEEK_NUM = calculateWeekNumberSync();
  function calculateWeekNumberSync() {
    const DEFAULT_ANCHOR = { sundayISO: '2026-09-13', week: 5 };
    let anchor = DEFAULT_ANCHOR;
    try {
      const raw = localStorage.getItem('currentAnchor.v1');
      if (raw) anchor = JSON.parse(raw);
    } catch {}
    const ref = new Date(anchor.sundayISO + 'T00:00:00');
    const now = new Date();
    now.setHours(0, 0, 0, 0);
    const dayOfWeek = now.getDay();
    const currentSunday = new Date(now);
    currentSunday.setDate(now.getDate() - dayOfWeek);
    const diffDays = Math.round((currentSunday - ref) / 86400000);
    let week = anchor.week + Math.round(diffDays / 7);
    if (week < ALL_WEEKS[0]) week = ALL_WEEKS[0];
    if (week > ALL_WEEKS[ALL_WEEKS.length - 1]) week = ALL_WEEKS[ALL_WEEKS.length - 1];
    return week;
  }

  let byPerson = new Map();
  let byCategory = { added: [], sachi: [], hasb: [] };

  function rebuildIndexes() {
    byPerson = new Map();
    byCategory = { added: [], sachi: [], hasb: [] };

    ALL_WEEKS.forEach((week) => {
      const d = WEEK_DATA[week];
      if (d.added) {
        const name = nameOf(d.added);
        const topic = getTopicFor(week, 'added');
        if (name) {
          if (!byPerson.has(name)) byPerson.set(name, []);
          byPerson.get(name).push({ week, cat: 'added', topic });
          byCategory.added.push({ week, name, topic });
        }
      }
      if (d.sachi) {
        const name = nameOf(d.sachi);
        const topic = getTopicFor(week, 'sachi');
        if (name) {
          if (!byPerson.has(name)) byPerson.set(name, []);
          byPerson.get(name).push({ week, cat: 'sachi', topic });
          byCategory.sachi.push({ week, name, topic });
        }
      }
      if (d.hasb) {
        const name = nameOf(d.hasb.trainee);
        const topic = getTopicFor(week, 'hasb');
        if (name) {
          if (!byPerson.has(name)) byPerson.set(name, []);
          byPerson.get(name).push({ week, cat: 'hasb', topic });
        }
        if (name || topic) byCategory.hasb.push({ week, name, topic });
      }
    });
    byPerson.forEach((arr) => arr.sort((a, b) => a.week - b.week));
  }

  const $ = (sel) => document.querySelector(sel);
  const $$ = (sel) => Array.from(document.querySelectorAll(sel));

  function renderCurrentBadge() {
    $('#currentBadge').innerHTML = '🗓️ השבוע הנוכחי: <strong>שבוע ' + CURRENT_WEEK_NUM + '</strong>';
  }

  function buildWeekButtons() {
    const grid = $('#weeksGrid');
    grid.innerHTML = '';
    const frag = document.createDocumentFragment();

    ALL_WEEKS.forEach((week) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'week-btn';
      if (week === CURRENT_WEEK_NUM) btn.classList.add('current');
      btn.textContent = 'שבוע ' + week;
      btn.addEventListener('click', () => openWeekModal(week));
      frag.appendChild(btn);
    });
    grid.appendChild(frag);
  }

  function renderTopicLine(week, cat, topic) {
    const editable = (cat === 'added' || cat === 'sachi');
    if (topic) {
      return '<div class="topic-line"><span style="color:#999; font-size:0.8rem;">נושא:</span> <span>' + topic + '</span>' +
        (editable ? ' <button type="button" class="edit-topic-btn" data-week="' + week + '" data-cat="' + cat + '">✎</button>' : '') + '</div>';
    }
    return editable ? '<div class="topic-line"><button type="button" class="add-topic-btn" data-week="' + week + '" data-cat="' + cat + '">+ הוסף נושא</button></div>' : '';
  }

  function openWeekModal(week) {
    const data = WEEK_DATA[week];
    const isCurrent = week === CURRENT_WEEK_NUM;
    const modal = $('#weekModal');
    const body = $('#modalBody');

    let footer = isCurrent ? '<div class="modal-footer"><span class="current-note">✓ זה השבוע הנוכחי</span></div>' :
      '<div class="modal-footer"><button type="button" class="set-current-btn" data-week="' + week + '">📌 קבע כשבוע הנוכחי</button></div>';

    body.innerHTML = '<h2>שבוע ' + week + (isCurrent ? ' (השבוע)' : '') + '</h2>' +
      '<div class="category-row"><div class="category-name">ערך מוסף:</div><div class="category-content"><span>' + (nameOf(data.added) || 'אין') + '</span>' + (data.added ? renderTopicLine(week, 'added', getTopicFor(week, 'added')) : '') + '</div></div>' +
      '<div class="category-row"><div class="category-name">סח"י:</div><div class="category-content"><span>' + (nameOf(data.sachi) || 'אין') + '</span>' + (data.sachi ? renderTopicLine(week, 'sachi', getTopicFor(week, 'sachi')) : '') + '</div></div>' +
      '<div class="category-row hasb"><div class="category-name">הסב"ש:</div><div class="category-content"><span>' + (data.hasb ? nameOf(data.hasb.trainee) : 'אין') + '</span>' + renderTopicLine(week, 'hasb', getTopicFor(week, 'hasb')) + '</div></div>' +
      footer;

    modal.hidden = false;
  }

  $('#modalClose').addEventListener('click', () => $('#weekModal').hidden = true);

  document.addEventListener('click', (e) => {
    const addBtn = e.target.closest('.add-topic-btn') || e.target.closest('.edit-topic-btn');
    if (addBtn) {
      const week = Number(addBtn.dataset.week);
      const cat = addBtn.dataset.cat;
      const val = prompt("הכנס נושא:", getTopicFor(week, cat) || '');
      if (val !== null) saveTopicToCloud(week, cat, val);
    }
    const setBtn = e.target.closest('.set-current-btn');
    if (setBtn) {
      localStorage.setItem('currentAnchor.v1', JSON.stringify({ week: Number(setBtn.dataset.week), sundayISO: '2026-09-13' }));
      location.reload();
    }
  });

  function renderPersonView(q) {
    let html = '';
    byPerson.forEach((items, name) => {
      if (q && !name.includes(q)) return;
      let rows = items.map(it => '<li><span class="week-badge">שבוע ' + it.week + '</span> <span>' + CAT_NAMES[it.cat] + '</span>' + renderTopicLine(it.week, it.cat, it.topic) + '</li>').join('');
      html += '<div class="person-card"><h3>👤 ' + name + '</h3><ul>' + rows + '</ul></div>';
    });
    $('#personList').innerHTML = html;
  }

  function renderCategoryView(q) {
    let html = '';
    ['added', 'sachi', 'hasb'].forEach(key => {
      let items = byCategory[key];
      if (q) items = items.filter(it => (it.name && it.name.includes(q)) || (it.topic && it.topic.includes(q)));
      let rows = items.map(it => '<li><span class="week-badge">שבוע ' + it.week + '</span> <span>' + (it.name || '—') + '</span>' + renderTopicLine(it.week, key, it.topic) + '</li>').join('');
      html += '<div class="category-section"><h3>🏷️ ' + CAT_NAMES[key] + '</h3><ul>' + rows + '</ul></div>';
    });
    $('#categoryList').innerHTML = html;
  }

  $$('.view-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      $$('.view-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      const view = tab.dataset.view;
      $$('.view-panel').forEach(p => p.hidden = p.id !== 'view-' + view);
      $('#toolbar').classList.toggle('hidden', view === 'week');
    });
  });

  $('#search').addEventListener('input', (e) => {
    const q = e.target.value.trim();
    renderPersonView(q);
    renderCategoryView(q);
  });

  $('#clearBtn').addEventListener('click', () => { $('#search').value = ''; renderPersonView(''); renderCategoryView(''); });

  function refreshUI() {
    rebuildIndexes();
    renderCurrentBadge();
    buildWeekButtons();
    renderPersonView('');
    renderCategoryView('');
  }

  refreshUI();
})();
</script>
</body>
</html>
